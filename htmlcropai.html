<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 50%;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            margin-bottom: 10px;
            padding: 10px;
            font-size: 1rem;
        }
        button {
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            font-size: 1rem;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crop Recommendation</h1>
        <form method="POST" action="/predict">
            <label for="N">Nitrogen (N):</label>
            <input type="text" id="N" name="N" required>

            <label for="P">Phosphorus (P):</label>
            <input type="text" id="P" name="P" required>

            <label for="K">Potassium (K):</label>
            <input type="text" id="K" name="K" required>

            <label for="humidity">Humidity (%):</label>
            <input type="text" id="humidity" name="humidity" required>

            <label for="temperature">Temperature (°C):</label>
            <input type="text" id="temperature" name="temperature" required>

            <label for="pH">pH Level:</label>
            <input type="text" id="pH" name="pH" required>

            <label for="rainfall">Rainfall (mm):</label>
            <input type="text" id="rainfall" name="rainfall" required>

            <button type="submit">Predict</button>
        </form>

        {% if prediction_text %}
            <h3>{{ prediction_text }}</h3>
        {% endif %}
    </div>
</body>
</html>
